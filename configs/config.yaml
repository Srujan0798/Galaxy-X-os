# SCALE x ODYSSEY -- Central Configuration
seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  image_size: 224
  batch_size: 32
  num_workers: 4

model:
  backbone: "efficientnet_b3"
  num_classes: 5
  dropout: 0.4

training:
  num_epochs: 50
  lr: 3.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  batch_size: 32
  patience: 12
  mixed_precision: true
  freeze_backbone_epochs: 3

paths:
  checkpoints: "checkpoints"
  results: "results"
  logs: "results/logs"
  gradcam_dir: "results/gradcam"
