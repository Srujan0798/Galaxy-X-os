data:
  batch_size: 32
  image_size: 224
  num_workers: 4
  processed_dir: data/processed
  raw_dir: data/raw
model:
  backbone: efficientnet_b3
  dropout: 0.4
  num_classes: 5
paths:
  checkpoints: checkpoints
  gradcam_dir: results/gradcam
  logs: results/logs
  results: results
training:
  batch_size: 32
  freeze_backbone_epochs: 3
  label_smoothing: 0.1
  lr: 0.0003
  mixed_precision: true
  num_epochs: 50
  patience: 12
  weight_decay: 0.0001
