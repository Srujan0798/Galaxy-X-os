# SCALE x ODYSSEY -- Central Configuration
seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  image_size: 224
  batch_size: 32
  num_workers: 4

model:
  backbone: "efficientnet_b3"  # Primary backbone (matches best_model.pth checkpoint)
  num_classes: 5
  dropout: 0.4

training:
  num_epochs: 50
  lr: 3.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  focal_gamma: 2.0
  batch_size: 32
  patience: 12
  mixed_precision: true
  freeze_backbone_epochs: 3
  gradient_clip: 1.0

paths:
  checkpoints: "checkpoints"
  results: "results"
  logs: "results/logs"
  gradcam_dir: "results/gradcam"

eval_checkpoint: "checkpoints/best_model.pth"