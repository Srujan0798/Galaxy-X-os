# SCALE x ODYSSEY — Central Configuration

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  splits:
    train: 0.80
    val: 0.10
    test: 0.10

model:
  backbone: "efficientnet_b3"
  pretrained: true
  dropout: 0.4
  num_classes: 5

training:
  num_epochs: 50
  lr: 3.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  patience: 12
  mixed_precision: true
  gradient_clip: 1.0
  freeze_backbone_epochs: 3

augmentation:
  use_astro_specific: true
  noise_prob: 0.4
  brightness_contrast_prob: 0.6
  flip_prob: 0.5
  rotate90_prob: 0.5
  dropout_prob: 0.3
  blur_prob: 0.2
  elastic_prob: 0.1

paths:
  checkpoints: "checkpoints"
  results: "results"
  logs: "results/logs"
  gradcam_samples: "results/gradcam_samples"
