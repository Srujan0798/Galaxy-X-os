[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-x-os"
version = "1.0.0"
description = "SCALE x ODYSSEY — Astronomical Image Classifier"
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# These files prepend their own dir to sys.path before importing siblings;
# E402 (import not at top) is inherent and intentional here.
"src/evaluate.py" = ["E402"]
"src/gradcam.py" = ["E402"]
"src/inference.py" = ["E402"]
"src/train.py" = ["E402"]
"src/prepare_data.py" = ["E402"]
"app/app.py" = ["E402"]
"src/download_archives.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
