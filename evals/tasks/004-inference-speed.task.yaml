# Eval: Inference Speed

## Input
- Trained checkpoint at checkpoints/best_model.pth
- Single 224x224 image

## Execution
1. Load ModelManager
2. Run predict() 10 times
3. Measure average time

## Verification
- Average < 100ms on CPU
- < 15ms on GPU

