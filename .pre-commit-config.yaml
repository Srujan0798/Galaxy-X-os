repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
  - repo: local
    hooks:
      - id: os-setup-preflight
        name: OS-Setup Preflight (FM-02/03/04/07/08/09/10/11/13/14)
        entry: bash /Users/srujansai/Desktop/Adaptoid-OS/validators/preflight.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
