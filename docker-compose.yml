# Galaxy-X-os docker-compose
# Requires: checkpoints/ with best_model.pth, data/ with processed/ dataset
# Optional: data/samples/ for demo without full dataset
version: '3.8'

services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./results:/app/results
