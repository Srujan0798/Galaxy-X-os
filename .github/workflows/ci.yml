name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: '**/requirements.txt'
      - run: pip install -r requirements.txt
      - run: make lint
      - run: python3 -m pytest tests/ -v -m "not network" --ignore=tests/performance --ignore=tests/fuzz

  smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: '**/requirements.txt'
      - run: pip install -r requirements.txt
      - run: python3 -m pytest tests/e2e/ tests/unit/test_checkpoint_smoke.py -v || true

  validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The verifier is fetched from outside the repo under test. A gate that
      # lives in the repo it judges can be edited by whatever is being judged.
      - name: Fetch Adaptoid validators
        run: git clone --depth 1 https://github.com/Srujan0798/Adaptoid-OS.git /tmp/adaptoid-os

      - name: Preflight (25 validators, incl. FM-09b entailment)
        run: bash /tmp/adaptoid-os/validators/preflight.sh .
