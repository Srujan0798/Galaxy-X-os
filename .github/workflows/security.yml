name: Security

on: [push, pull_request]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: '**/requirements.txt'
      # Secret scan — hard fail on obvious key material in source
      - name: Secret scan
        run: |
          set -euo pipefail
          if grep -rE 'API_KEY\s*=\s*["\x27][^"\x27]+|SECRET_KEY\s*=\s*["\x27]|PRIVATE_KEY\s*=\s*["\x27]|BEGIN (RSA |OPENSSH )?PRIVATE KEY' \
            src/ app/ configs/ --include='*.py' --include='*.yml' --include='*.yaml' \
            --include='*.json' --include='*.cfg' --include='*.ini' 2>/dev/null; then
            echo "Possible secrets found in source — fail"
            exit 1
          fi
          echo "Secret scan clean"
      # Dependency audit — report only (torch ecosystem often has CVEs; do not block ship)
      - name: pip-audit (report)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
